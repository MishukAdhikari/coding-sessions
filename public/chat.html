<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat — Coding Sessions</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/theme.js?v=2"></script>
<script src="/native.js?v=1"></script>
<link rel="stylesheet" href="/tokens.css?v=4">
<link rel="stylesheet" href="/chat.css?v=1">
</head>
<body class="chat-page">

<!-- A session's conversation. Agent and tool text is only ever set as text or
     built into nodes by chat-markdown.js, never parsed as markup. Closing this
     tab ends nothing. -->

<header class="cv-header">
  <button id="btn-chat-close" class="cv-icon-btn" type="button" aria-label="Close chat">
    <svg class="cv-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3.75 5.75 8 10 12.25"/></svg>
  </button>
  <div class="cv-heading">
    <h1 id="chat-name" class="cv-name">Chat</h1>
    <div class="cv-meta">
      <span id="chat-status" class="cv-status" data-tone="starting" role="status" aria-live="polite"><span class="cv-dot" aria-hidden="true"></span><span id="chat-status-text">Connecting…</span></span>
      <span id="chat-agent" class="cv-agent" hidden></span>
    </div>
  </div>
  <button id="btn-chat-term" class="cv-text-btn" type="button">
    <svg class="cv-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.25 3.25h11.5v9.5H2.25z M4.75 6.25 6.75 8l-2 1.75 M8.5 10h2.75"/></svg>
    <span>Terminal</span>
  </button>
</header>

<main id="chat-main" class="cv-main">
  <div class="cv-column">
    <div id="chat-loading" class="cv-loading" aria-label="Loading the conversation" role="status">
      <span class="cv-skel cv-skel-user"></span>
      <span class="cv-skel"></span>
      <span class="cv-skel cv-skel-short"></span>
      <span class="cv-skel"></span>
    </div>
    <div id="chat-empty" class="cv-empty" hidden>
      <p class="cv-empty-title">No messages yet</p>
      <p class="cv-empty-body"></p>
    </div>
    <div id="chat-list" class="cv-list" role="log" aria-label="Conversation" aria-busy="false"></div>
    <p id="chat-working" class="cv-working" hidden><span class="cv-dots" aria-hidden="true"><i></i><i></i><i></i></span>Working</p>
  </div>
</main>

<div id="chat-dock" class="cv-dock">
  <button id="chat-jump" class="cv-jump" type="button" hidden>
    <svg class="cv-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 3v10 M3.75 8.75 8 13l4.25-4.25"/></svg>
    New messages
  </button>
  <div class="cv-column">
    <div id="chat-banner" class="cv-banner" role="status" hidden>
      <strong>Waiting on you.</strong>
      <span>The agent is asking. Reply below, or open the terminal to pick from a menu.</span>
    </div>
    <section id="chat-permission" class="cv-perm" aria-labelledby="chat-permission-title" hidden></section>
    <form id="chat-form" class="cv-composer" data-state="ready">
      <label for="chat-input" class="sr-only">Message</label>
      <textarea id="chat-input" class="cv-input" rows="1" placeholder="Message the agent" autocomplete="off" enterkeyhint="send" aria-describedby="chat-reason"></textarea>
      <button id="chat-stop" class="cv-round cv-stop" type="button" aria-label="Stop the agent" hidden>
        <svg class="cv-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.75 4.75h6.5v6.5h-6.5z"/></svg>
      </button>
      <button id="chat-send" class="cv-round cv-send" type="submit" aria-label="Send" disabled>
        <svg class="cv-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 13V3 M3.75 7.25 8 3l4.25 4.25"/></svg>
      </button>
    </form>
    <p id="chat-reason" class="cv-reason" hidden></p>
    <p id="chat-error" class="cv-error" role="alert" hidden></p>
  </div>
</div>

<div id="chat-gone" class="cv-gone" hidden>
  <p id="chat-gone-title" class="cv-gone-title">This session has ended.</p>
  <p id="chat-gone-body" class="cv-gone-body">Its conversation is kept by the agent. Resume it from ended history in the app.</p>
  <a id="chat-gone-link" class="cv-gone-link" href="/">Back to sessions</a>
</div>

<script src="/chat-markdown.js?v=1"></script>
<script src="/chat-view.js?v=1"></script>
<script src="/chat.js?v=2"></script>
</body>
</html>
