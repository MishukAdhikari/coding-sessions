# Managed instance template. Complete TLS provisioning before remote use.
# Replace @INSTANCE@, @HOST@ and @PORT@ using install-ubuntu.
server {
    listen 80;
    listen [::]:80;
    server_name @HOST@;
    # External MCP sign-in returns here with a one-time code and state in the query string.
    # Same proxying as below; only this exact path is left out of the access and error logs
    # (an upstream error here would otherwise log the full request line). Trade-off: proxy
    # errors for this one path are not logged; every other path keeps its logs.
    location = /oauth/connectors/callback {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
